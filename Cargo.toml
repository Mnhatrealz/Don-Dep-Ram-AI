[package]
name = "memscript-ai"
version = "1.0.0"
edition = "2021"
authors = ["MemScript-AI Team"]
description = "AI-Driven Low-Level Windows Hardware Optimizer (RAM, CPU, GPU, Disk) with Custom DSL"

[dependencies]
# Windows API bindings
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

# HTTP client & JSON for xKiro AI API
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Utilities
colored = "2.1"
sysinfo = "0.31"
chrono = "0.4"
dirs = "5.0"

# Tối ưu hóa kích thước file .exe nhỏ nhất và tốc độ cao nhất
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
